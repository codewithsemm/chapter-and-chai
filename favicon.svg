<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Chapter &amp; Chai favicon</title>
  <desc id="desc">A golden steaming coffee cup resting on an open book inside a dark espresso circle</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0D4"/>
      <stop offset="0.52" stop-color="#E8B477"/>
      <stop offset="1" stop-color="#B77946"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E2"/>
      <stop offset="1" stop-color="#E3B782"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="63" fill="#251B16"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Three warm steam curls -->
  <path d="M50 39c-7-8 7-13 0-23M64 38c-7-8 8-14 1-24M77 39c-7-8 7-13 1-22" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cup handle -->
  <path d="M86 49c19-3 19 24-1 23" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M86 52c12-2 13 16-1 16" fill="none" stroke="#251B16" stroke-width="3.3" stroke-linecap="round"/>
  <!-- Coffee cup and espresso surface -->
  <path d="M35 49h52l-5 25c-2 9-10 14-21 14S43 83 41 74z" fill="url(#cream)" stroke="#B77946" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="61" cy="49" rx="26" ry="8" fill="#F8E7C9" stroke="#B77946" stroke-width="2"/>
  <ellipse cx="61" cy="49" rx="20" ry="5" fill="#7B4224"/>
  <!-- Latte-art heart -->
  <path d="M61 54c-8-5-11-9-7-11 3-1 5 1 7 3 2-2 4-4 7-3 4 2 1 6-7 11z" fill="#FFF1D8"/>
  <!-- Book underneath cup -->
  <path d="M19 93c16-5 30-4 45 3 15-7 29-8 45-3v16c-17-4-31-3-45 4-14-7-28-8-45-4z" fill="url(#gold)" stroke="#251B16" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 96v17M25 99c13-2 24-1 34 4M69 103c10-5 21-6 34-4" stroke="#7A482E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M26 105c12-1 22 0 33 4M69 109c11-4 21-5 33-4" stroke="#7A482E" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>
